[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jiejian"
dynamic = ["version"]
description = "面向 Vibe Coding 的权限意图持续验证与断裂诊断系统"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "playwright>=1.61,<1.62",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
jiejian = "product.backend.cli:main"

[dependency-groups]
dev = [
    # 自定义 Wheel 钩子由编辑器和开发检查直接导入，开发环境必须能够解析其公开接口。
    "hatchling>=1.27,<2",
    # 自动 L5 只在开发职责目录使用 UI Automation，不进入产品运行依赖。
    "pywinauto==0.6.9",
    "pytest>=8.3,<9",
    # Conda 的 Python 基线保留 distutils-precedence.pth，开发同步必须由 uv 提供其入口。
    "setuptools>=80,<84",
]

[tool.hatch.build.targets.wheel]
only-include = ["product/backend", "product/protocols"]

[tool.hatch.version]
path = "product/backend/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"product/config/default.toml" = "product/config/default.toml"
"product/config/toolchain.json" = "product/config/toolchain.json"

[tool.hatch.build.hooks.custom]
path = "scripts/build/hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "essential: 跨模块变更必须通过的必要回归门禁",
    "browser: 启动或依赖 Playwright/浏览器边界",
    "process: 拉起独立 Runner、Worker、Recording Runner 或 CLI 子进程",
    "database: 创建、升级或通过事务访问数据库",
    "e2e: 通过产品入口验证跨能力端到端行为",
    "slow: 相对较慢的浏览器或多进程完整闭环测试",
]
