[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jiejian"
version = "0.1.0"
description = "面向 AI 生成 Web 应用的交付前安全验证与持续回归平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.15,<1",
]

[project.scripts]
jiejian = "jiejian.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jiejian"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
