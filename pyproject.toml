[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jiejian"
dynamic = ["version"]
description = "面向 Vibe Coding 的权限意图持续验证与断裂诊断系统"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.26,<5",
    "mcp>=2,<3",
    "playwright>=1.61,<1.62",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
jiejian = "product.backend.interfaces.cli:main"

[dependency-groups]
dev = [
    # 自定义 Wheel 钩子由编辑器和开发检查直接导入，开发环境必须能够解析其公开接口。
    "hatchling>=1.27,<2",
    # 自动 L5 只在开发职责目录使用 UI Automation，不进入产品运行依赖。
    "pywinauto==0.6.9",
    "pytest>=8.3,<9",
    # Conda 的 Python 基线保留 distutils-precedence.pth，开发同步必须由 uv 提供其入口。
    "setuptools>=80,<84",
]

[tool.hatch.build.targets.wheel]
only-include = ["product/backend", "product/protocols"]

[tool.hatch.version]
path = "product/backend/__init__.py"

# 动态版本文件变化后重新计算安装元数据，所有发布入口沿用同一产品版本。
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "product/backend/__init__.py" }]

[tool.hatch.build.targets.wheel.force-include]
"product/config/default.toml" = "product/config/default.toml"
"product/config/toolchain.json" = "product/config/toolchain.json"

[tool.hatch.build.hooks.custom]
path = "scripts/build/hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "runtime: 在独立官方示例中启动本地 Worker、Runner 和浏览器的显式验收",
    "baseline: 独立官方示例基础准备与检查",
    "repair: 独立官方示例的原问题与修复复验",
    "level1: 静态结构与声明验证",
    "level2: 确定性业务或组件验证",
    "level3: 相邻组件、HTTP 或持久化验证",
    "level4: 独立本地进程与真实流程验证",
    "database: 实际数据库边界",
    "process: 需要本地子进程",
    "browser: 需要受控浏览器",
    "slow: 高成本本地场景",
]
